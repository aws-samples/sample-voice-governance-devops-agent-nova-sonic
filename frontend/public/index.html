<!doctype html>
<!--
  Nova Sonic Support Portal — app shell.

  Responsive Bootstrap 5 layout: every feature is operable without
  horizontal scrolling from 320 px to 1920 px, with mobile parity
  (Req 9.2, 9.3). Runtime configuration is fetched from ./config.json,
  generated at deploy time from Terraform outputs — never committed
  (Req 14.3; see config.example.json for the shape).

  Element ids form the contract between the shell and the feature modules:
    #alert-area             page-level alerts (config/capability errors)
    #user-info              auth status (src/auth/cognito.js)
    #session-status         status badge (src/ui/status.js)
    #btn-session-start      session start (src/main.js gate + ws client)
    #btn-session-stop       session stop
    #btn-session-reconnect  reconnect after interruption (src/ws/voice-client.js)
    #transcript             transcript log (src/ui/transcript.js)
    #notifications-list     incident notification feed (src/ui/incident-popup.js)
    #btn-push-enable        web push opt-in (src/push/push-manager.js)
    #toast-area             incident popup toasts (src/ui/incident-popup.js)
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Voice-driven support portal for DevOps engineers: talk to Nova Sonic, reach the AWS DevOps Agent, and receive incident notifications."
    />
    <title>Nova Sonic Support Portal</title>
    <!-- The integrity value below is a public Subresource Integrity (SRI)
         hash, not a secret. It lets the browser verify the CDN asset was not
         tampered with. detect-secrets flags it as a high-entropy string; the
         trailing pragma on the integrity line allowlists that false positive. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      crossorigin="anonymous"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" /> <!-- pragma: allowlist secret -->
    <style>
      /* Bounded scroll regions keep the layout free of horizontal
         scrolling across 320-1920 px viewports (Req 9.2). The two
         transcript panes scroll independently so a long turn on one side
         never pushes the other out of view. */
      .transcript-thread {
        min-height: 12rem;
        max-height: 50vh;
        overflow-y: auto;
        overflow-wrap: anywhere;
      }
      /* Chat bubbles: capped width so long turns wrap instead of spanning
         the full thread, and the role's own side is hugged. */
      .transcript-entry {
        max-width: 85%;
      }
      .transcript-entry[data-role='user'] {
        margin-left: auto;
      }
      .transcript-entry[data-role='assistant'] {
        margin-right: auto;
      }
      /* Session controls: an ENABLED button is fully saturated (solid
         green start / solid red end, white text), while a DISABLED one
         renders neutral gray instead of a washed-out tint of its own
         color — Bootstrap's default .65 opacity on a red button reads as
         "faded red", which is easily mistaken for an active-but-ugly
         button. Gray is unambiguous. */
      #btn-session-start:not(:disabled),
      #btn-session-stop:not(:disabled) {
        opacity: 1;
        color: #fff;
      }
      #btn-session-start:disabled,
      #btn-session-stop:disabled {
        background-color: #adb5bd;
        border-color: #adb5bd;
        color: #f8f9fa;
        opacity: 1;
        cursor: not-allowed;
      }
      #notifications-list {
        max-height: 40vh;
        overflow-y: auto;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body class="bg-body-tertiary">
    <header>
      <nav class="navbar bg-body border-bottom" aria-label="Portal">
        <div class="container-lg flex-nowrap">
          <h1 class="navbar-brand h5 mb-0 text-truncate">
            Nova Sonic Support Portal
          </h1>
          <span
            id="user-info"
            class="navbar-text small text-body-secondary text-truncate"
          >
            Not signed in
          </span>
        </div>
      </nav>
    </header>

    <main class="container-lg py-3">
      <div id="alert-area" aria-live="assertive"></div>

      <div class="row g-3">
        <!-- Voice session panel -->
        <section class="col-12 col-lg-8" aria-labelledby="voice-panel-title">
          <div class="card shadow-sm">
            <div
              class="card-header d-flex flex-wrap align-items-center justify-content-between gap-2"
            >
              <h2 id="voice-panel-title" class="h5 mb-0">Voice session</h2>
              <span
                id="session-status"
                class="badge text-bg-secondary"
                role="status"
                aria-label="Voice session status"
              >
                idle
              </span>
            </div>
            <div class="card-body">
              <div class="d-flex flex-wrap gap-2 mb-3">
                <!-- Solid contextual variants (green start / red end, both
                     with white text): the outline style rendered gray text
                     on white, which read as "disabled" even while the
                     button was active. Bootstrap dims solid buttons when
                     actually disabled, so the two states stay distinct. -->
                <button
                  id="btn-session-start"
                  type="button"
                  class="btn btn-success"
                  disabled
                >
                  Start session
                </button>
                <button
                  id="btn-session-stop"
                  type="button"
                  class="btn btn-danger"
                  disabled
                >
                  End session
                </button>
                <button
                  id="btn-session-reconnect"
                  type="button"
                  class="btn btn-warning d-none"
                >
                  Reconnect
                </button>
              </div>
              <!-- Typed input alongside voice: resource identifiers, ARNs,
                   and error strings are far easier typed than pronounced.
                   Enabled only while a session is underway (the same rule
                   as the End button); submitting sends a text.input frame
                   on the open voice socket. -->
              <form id="text-input-form" class="input-group mb-3">
                <label class="visually-hidden" for="text-input">
                  Type a request
                </label>
                <input
                  id="text-input"
                  type="text"
                  class="form-control"
                  placeholder="Type a request (for example an instance id)"
                  autocomplete="off"
                  maxlength="1000"
                  disabled
                />
                <button
                  id="btn-text-send"
                  type="submit"
                  class="btn btn-primary"
                  disabled
                >
                  Send
                </button>
              </form>

              <!-- Chat-style transcript: ONE chronological thread, so a
                   reply always sits directly under the request it answers.
                   Role is conveyed by alignment and colour (assistant left,
                   engineer right) rather than by separate columns — two
                   independent panes forced the reader to correlate turns
                   across sides by timestamp. -->
              <div
                id="transcript"
                role="log"
                aria-live="polite"
                aria-label="Conversation transcript"
                class="transcript-thread border rounded p-2 bg-body"
              >
                <p class="text-body-secondary mb-0" data-transcript-placeholder>
                  Your conversation will appear here.
                </p>
              </div>
            </div>
          </div>
        </section>

        <!-- Incident notifications panel -->
        <section
          class="col-12 col-lg-4"
          aria-labelledby="notifications-panel-title"
        >
          <div class="card shadow-sm">
            <div
              class="card-header d-flex flex-wrap align-items-center justify-content-between gap-2"
            >
              <h2 id="notifications-panel-title" class="h5 mb-0">
                Incident notifications
              </h2>
              <button
                id="btn-push-enable"
                type="button"
                class="btn btn-sm btn-outline-primary"
                disabled
              >
                Enable push
              </button>
            </div>
            <div class="card-body">
              <div
                id="notifications-list"
                aria-live="polite"
                aria-label="Incident notifications"
              >
                <p class="text-body-secondary mb-0">
                  Incident notifications will appear here.
                </p>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- Incident popup toasts render here, above all content -->
    <div
      id="toast-area"
      class="toast-container position-fixed bottom-0 end-0 p-3"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    <!-- As above, this integrity value is a public SRI hash, not a secret.
         The trailing pragma on the integrity line allowlists the
         detect-secrets false positive. -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
      defer
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"></script> <!-- pragma: allowlist secret -->
    <!-- Root-relative: the deployed bundle places index.html at the site
         root and the modules at /src/, and a "../" reference resolved from
         a deep link (e.g. /a/b/c rewritten to the shell) would fetch HTML
         instead of the module (BUG-25). -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
